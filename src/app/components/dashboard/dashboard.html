<div class="container py-5 text-center">
  <header class="mb-5">
    <h5 class="text-secondary fw-bold">المركز الوطني للإعلامية</h5>
    <h6 class="text-muted">وحدة التكوين و الرسكلة</h6>
    <hr class="w-25 mx-auto border-secondary">
    <h2 class="mt-4 fw-black text-dark">التصرف في المنظومة</h2>
  </header>

  <div class="row g-4 justify-content-center">

    <div class="col-md-4 col-sm-6">
      <div class="card h-100 shadow-sm border-0 border-top border-success border-4 card-btn">
        <div class="card-body d-flex flex-column align-items-center justify-content-center p-4">
          <i class="bi bi-calendar-plus text-success fs-1 mb-3"></i>
          <h5 class="card-title fw-bold text-dark">إضافة دورة تكوينية</h5>
          <p class="card-text text-muted small">إدارة وتخطيط الدورات التدريبية الجديدة</p>
          <button routerLink= "/cycles" class="btn btn-success px-4 mt-2 rounded-pill w-100">دخول</button>
        </div>
      </div>
    </div>

    <div class="col-md-4 col-sm-6">
      <div class="card h-100 shadow-sm border-0 border-top border-success border-4 card-btn">
        <div class="card-body d-flex flex-column align-items-center justify-content-center p-4">
          <i class="bi bi-person-plus text-success fs-1 mb-3"></i>
          <h5 class="card-title fw-bold text-dark">إضافة مكون</h5>
          <p class="card-text text-muted small">تسجيل المكونين والأساتذة الجدد</p>
          <button routerLink="/formateurs" class="btn btn-success px-4 mt-2 rounded-pill w-100">دخول</button>
        </div>
      </div>
    </div>

    <div class="col-md-4 col-sm-6">
      <div class="card h-100 shadow-sm border-0 border-top border-success border-4 card-btn">
        <div class="card-body d-flex flex-column align-items-center justify-content-center p-4">
          <i class="bi bi-people text-success fs-1 mb-3"></i>
          <h5 class="card-title fw-bold text-dark">قائمة المشاركين</h5>
          <p class="card-text text-muted small">عرض وتحيين قائمة المتكونين المسجلين</p>
          <button routerLink="/participants" class="btn btn-success px-4 mt-2 rounded-pill w-100">عرض القائمة</button>
        </div>
      </div>
    </div>

  </div>

  <footer class="mt-5 pt-4">
    <button routerLink="/login" class="btn btn-outline-danger px-4 rounded-pill shadow-sm">
      <i class="bi bi-box-arrow-left me-2"></i> تسجيل الخروج
    </button>
  </footer>
</div>
