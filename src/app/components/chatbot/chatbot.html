<div class="chatbot-wrapper" dir="rtl">

  <button (click)="toggleChat()" class="btn btn-success rounded-circle shadow-lg chatbot-trigger-btn" type="button">
    @if (isOpen) {
      <i class="bi bi-x-lg fs-4"></i>
    } @else {
      <i class="bi bi-stars fs-4"></i>
    }
  </button>

  @if (isOpen) {
    <div class="card shadow-lg border-0 rounded-4 chatbot-window">

      <div class="card-header bg-success text-white d-flex justify-content-between align-items-center py-3 rounded-top-4">
        <div class="d-flex align-items-center gap-2">
          <div class="bg-white text-success rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 40px; height: 40px;">
            <i class="bi bi-robot fs-5"></i>
          </div>
          <div>
            <h6 class="mb-0 fw-bold">مساعد الذكاء الاصطناعي</h6>
            <small class="text-white-50 d-flex align-items-center gap-1" style="font-size: 0.72rem;">
              <span class="online-indicator"></span> متصل الآن
            </small>
          </div>
        </div>
        <button (click)="toggleChat()" class="btn-close btn-close-white shadow-none" type="button"></button>
      </div>

      <div class="card-body p-3 overflow-y-auto chatbot-body" #scrollMe>
        @for (m of messages; track $index) {
          <div class="d-flex mb-3" [ngClass]="m.sender === 'user' ? 'justify-content-start' : 'justify-content-end'">
            <div class="message-bubble p-3 rounded-4 shadow-sm"
                 [ngClass]="m.sender === 'user' ? 'user-bubble' : 'bot-bubble'">
              <p class="mb-1 small text-wrap lh-base">{{ m.text }}</p>
              <span class="d-block text-end opacity-75 extra-small" style="font-size: 0.65rem;">{{ m.time }}</span>
            </div>
          </div>
        }

        @if (isTyping) {
          <div class="d-flex justify-content-end mb-3">
            <div class="bot-bubble p-2 px-3 rounded-4 border text-muted small d-flex align-items-center gap-2 shadow-sm">
              <span style="font-size: 0.8rem;">جاري التفكير...</span>
              <div class="typing-dots">
                <span></span><span></span><span></span>
              </div>
            </div>
          </div>
        }
      </div>

      <div class="p-2 bg-light border-top border-bottom overflow-x-auto d-flex gap-1 align-items-center hide-scrollbar">
        @for (q of questionsRapides; track q) {
          <button (click)="envoyerMessage(q)"
                  [disabled]="isTyping"
                  class="btn btn-outline-success btn-sm rounded-pill text-nowrap py-1 px-3 bg-white"
                  style="font-size: 0.75rem;">
            {{ q }}
          </button>
        }
      </div>

      <div class="card-footer bg-white border-0 p-2 rounded-bottom-4">
        <form (ngSubmit)="envoyerMessage()" class="d-flex gap-2 align-items-center">
          <input type="text"
                 [(ngModel)]="saisieUtilisateur"
                 name="userMsg"
                 [disabled]="isTyping"
                 class="form-control form-control-sm rounded-pill px-3 bg-light border-0 shadow-none py-2"
                 placeholder="اكتب سؤالك هنا..."
                 autocomplete="off">
          <button type="submit"
                  [disabled]="!saisieUtilisateur.trim() || isTyping"
                  class="btn btn-success rounded-circle d-flex align-items-center justify-content-center p-0 flex-shrink-0"
                  style="width: 36px; height: 36px;">
            <i class="bi bi-send-fill fs-6"></i>
          </button>
        </form>
      </div>

    </div>
  }

</div>
